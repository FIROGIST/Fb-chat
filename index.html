<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB Chat - تسجيل الدخول</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="logo">
                <h1>🔥 FB Chat</h1>
                <p>تسجيل الدخول للمتابعة</p>
            </div>
            
            <!-- نموذج تسجيل الدخول -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">اسم المستخدم</label>
                    <input type="text" id="username" name="username" placeholder="أدخل اسم المستخدم" required>
                </div>
                
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required>
                </div>
                
                <div class="form-group remember-me">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">تذكرني على هذا الجهاز</label>
                </div>
                
                <button type="submit" class="btn-login">تسجيل الدخول</button>
                
                <div class="register-link">
                    <p>ليس لديك حساب؟ <a href="#" id="showRegister">إنشاء حساب جديد</a></p>
                </div>
                
                <div id="loginMessage" class="message"></div>
            </form>
            
            <!-- نموذج التسجيل -->
            <form id="registerForm" style="display: none;">
                <div class="form-group">
                    <label for="regName">الاسم الكامل</label>
                    <input type="text" id="regName" name="name" placeholder="أدخل اسمك الكامل" required>
                </div>
                
                <div class="form-group">
                    <label for="regUsername">اسم المستخدم</label>
                    <input type="text" id="regUsername" name="username" placeholder="اختر اسم مستخدم" required>
                </div>
                
                <div class="form-group">
                    <label for="regTelegram">معرف تيليجرام (اختياري)</label>
                    <input type="text" id="regTelegram" name="telegram_username" placeholder="مثال: username">
                </div>
                
                <div class="form-group">
                    <label for="regPassword">كلمة المرور</label>
                    <input type="password" id="regPassword" name="password" placeholder="أنشئ كلمة مرور" required>
                </div>
                
                <div class="form-group">
                    <label for="regAvatar">الصورة الشخصية (اختياري)</label>
                    <input type="file" id="regAvatar" name="avatar" accept="image/*">
                </div>
                
                <button type="submit" class="btn-register">إنشاء حساب</button>
                
                <div class="register-link">
                    <p>لديك حساب بالفعل؟ <a href="#" id="showLogin">تسجيل الدخول</a></p>
                </div>
                
                <div id="registerMessage" class="message"></div>
            </form>
        </div>
    </div>
    
    <!-- ملفات الجافاسكريبت -->
    <script src="js/firebase-config.js"></script>
    <script src="js/telegram.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
